<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex Living Dex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--shell:#c8102e;--shell-d:#8e0b20;--screen:#9bbc0f;--screen-d:#306230;--ink:#0f380f;--panel:#f4f1e8;--line:#d6d0c0;--txt:#1d1d1d;--muted:#6b665c;--ok:#2e8b57}
*{box-sizing:border-box}
body{margin:0;background:#2a2a2a;font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}
.dex{max-width:1200px;margin:16px auto;background:var(--shell);border-radius:22px 22px 22px 60px;box-shadow:inset -8px -8px 0 var(--shell-d),0 10px 30px #0008;padding:16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:4px solid var(--shell-d);margin-bottom:12px}
.lens{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#bfe9ff,#1e88e5 55%,#0d47a1);border:5px solid #fff;box-shadow:0 0 0 3px #222}
.leds{display:flex;gap:6px}.leds i{width:14px;height:14px;border-radius:50%;border:2px solid #222;display:block}
.leds i:nth-child(1){background:#ff5252}.leds i:nth-child(2){background:#ffd740}.leds i:nth-child(3){background:#69f0ae}
h1{font:400 22px Silkscreen,monospace;color:#fff;margin:0;text-shadow:2px 2px 0 var(--shell-d)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
select,input,button{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid #222;background:#fff}
button{cursor:pointer;background:#222;color:#fff}button:hover{background:#444}
.grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:12px}
.box{background:var(--panel);border:4px solid #222;border-radius:10px;min-height:300px}
.lcd{background:var(--screen);color:var(--ink);font-family:VT323,monospace;font-size:20px;padding:10px;border-bottom:4px solid #222;border-radius:6px 6px 0 0}
.bar{height:10px;background:var(--screen-d);border-radius:5px;overflow:hidden;margin-top:6px}.bar b{display:block;height:100%;background:var(--ink)}
.filters{display:flex;gap:6px;padding:8px;flex-wrap:wrap}.filters input{flex:1;min-width:120px}
.list{max-height:70vh;overflow:auto}
.row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-top:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:#fff6c8}
.row img{width:40px;height:40px;image-rendering:pixelated}
.row .n{color:var(--muted);font-family:VT323,monospace;font-size:18px;width:42px}
.row .nm{flex:1;text-transform:capitalize}
.row input{width:20px;height:20px;accent-color:var(--ok)}
.row.got .nm{color:var(--ok);font-weight:600}
#det{padding:0}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top img{width:120px;height:120px;image-rendering:pixelated;background:#cfe3a0;border:3px solid var(--ink);border-radius:8px}
.top h2{margin:0;font:400 24px Silkscreen,monospace;text-transform:capitalize}
.types span{display:inline-block;padding:2px 10px;border-radius:12px;background:#777;color:#fff;font:400 13px Silkscreen,monospace;margin-right:4px;text-transform:uppercase;border:2px solid #0004}
.art{display:flex;gap:10px;align-items:flex-end}.art .big{width:170px;height:170px;object-fit:contain;image-rendering:auto;background:radial-gradient(circle,#e8f5c8,#9bbc0f);border:3px solid var(--ink);border-radius:50%}
.shiny{font-size:13px;padding:4px 8px;margin-top:6px}
.evo .st img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto}
.chips span img{width:40px;height:40px;image-rendering:pixelated;vertical-align:middle}
.body{padding:12px}
h3{font:400 15px Silkscreen,monospace;margin:14px 0 6px;color:var(--shell)}
.loc{border:2px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fff}
.loc h4{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.loc a{font-size:13px;font-weight:400}
.how{font-size:14px;margin:2px 0}.how em{color:var(--muted);font-style:normal}
.tag{display:inline-block;background:#ffe082;border-radius:6px;padding:0 6px;margin:1px 2px;font-size:12px}
.tip{background:#e3f2fd;border-left:4px solid #1e88e5;padding:4px 8px;margin:4px 0;font-size:13px}
.evo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.evo .st{background:#fff;border:2px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;text-transform:capitalize}
.evo .how2{font-size:12px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;padding:8px 12px 0}.tabs button{background:#ddd;color:#222}.tabs button.on{background:#222;color:#fff}
.ga{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:2px solid #222;border-radius:8px;padding:2px 8px;cursor:pointer;background:#fff;text-transform:capitalize}
.chips span.miss{border-color:var(--shell);color:var(--shell)}
footer{color:#fff;font-size:12px;margin-top:10px;opacity:.85}footer a{color:#fff}
@media(max-width:760px){.dex{margin:0;border-radius:0;padding:10px}.grid{grid-template-columns:1fr}.list{max-height:45vh}.ctrl{margin-left:0;width:100%}.ctrl>*{flex:1}}
</style>
</head>
<body>
<div class="dex">
<header>
  <div class="lens"></div><div class="leds"><i></i><i></i><i></i></div>
  <h1>Living Dex</h1>
  <div class="ctrl">
    <select id="game" aria-label="Jogo"></select>
    <select id="mode" aria-label="Tipo de dex"><option value="reg">Dex regional</option><option value="nat">Dex nacional (até a gen)</option></select>
    <button id="exp" title="Salvar progresso em arquivo">Exportar</button>
    <button id="imp" title="Carregar progresso de arquivo">Importar</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>
<div class="grid">
  <section class="box">
    <div class="lcd"><div id="prog">Carregando...</div><div class="bar"><b id="pbar" style="width:0"></b></div></div>
    <div class="filters">
      <input id="q" placeholder="Nome ou número..." aria-label="Buscar">
      <select id="show" aria-label="Filtro"><option value="all">Todos</option><option value="miss">Faltando</option><option value="got">Tenho</option></select>
    </div>
    <div class="list" id="list"></div>
  </section>
  <section class="box" id="det"><div class="empty">Escolha um Pokémon na lista.</div></section>
</div>
<footer>Dados: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> (consulta ao vivo). Progresso salvo neste navegador; use Exportar para guardar.</footer>
</div>
<script>
// Jogos do Paulo: versões PokéAPI, dex regional, pasta de sprites da época e teto da dex nacional.
const GAMES={
  yellow:{nome:'Yellow',ver:['yellow'],dex:['kanto'],spr:'generation-i/yellow',nat:151,reg:'kanto'},
  crystal:{nome:'Crystal',ver:['crystal'],dex:['original-johto'],spr:'generation-ii/crystal',nat:251,reg:'johto'},
  emerald:{nome:'Emerald',ver:['emerald'],dex:['hoenn'],spr:'generation-iii/emerald',nat:386,reg:'hoenn'},
  platinum:{nome:'Platinum',ver:['platinum'],dex:['extended-sinnoh'],spr:'generation-iv/platinum',nat:493,reg:'sinnoh'},
  black:{nome:'Black',ver:['black'],dex:['original-unova'],spr:'generation-v/black-white',nat:649,reg:'unova'},
  y:{nome:'Y',ver:['y'],dex:['kalos-central','kalos-coastal','kalos-mountain'],spr:'generation-vi/x-y',nat:721,reg:'kalos'},
  ultrasun:{nome:'Ultra Sun',ver:['ultra-sun'],dex:['updated-alola'],spr:'generation-vii/ultra-sun-ultra-moon',nat:807,reg:'alola'},
  sword:{nome:'Sword (+ DLCs)',ver:['sword','the-isle-of-armor-sword','the-crown-tundra-sword'],dex:['galar','isle-of-armor','crown-tundra'],spr:null,nat:898,reg:'galar'}
};
const API='https://pokeapi.co/api/v2/', SPR='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const $=s=>document.querySelector(s);
const cache=new Map();
async function get(u){u=u.startsWith('http')?u:API+u;if(!cache.has(u))cache.set(u,fetch(u).then(r=>{if(!r.ok)throw Error(r.status+' '+u);return r.json()}).catch(e=>{cache.delete(u);throw e}));return cache.get(u)}
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const idOf=u=>+u.split('/').filter(Boolean).pop();
const pretty=s=>s.replace(/-area$/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

const METODO={walk:'Grama / caverna (andando)','old-rod':'Pescar com Old Rod','good-rod':'Pescar com Good Rod','super-rod':'Pescar com Super Rod',surf:'Surfando','rock-smash':'Quebrando pedra (Rock Smash)',headbutt:'Cabeçada em árvore (Headbutt)','headbutt-low':'Headbutt em árvore (chance baixa)','headbutt-normal':'Headbutt em árvore','headbutt-high':'Headbutt em árvore (chance alta)','dark-grass':'Grama escura','grass-spots':'Grama tremendo','cave-spots':'Poeira na caverna','bridge-spots':'Sombra na ponte','super-rod-spots':'Pescar em água ondulando','surf-spots':'Surfar em água ondulando','yellow-flowers':'Flores amarelas','purple-flowers':'Flores roxas','red-flowers':'Flores vermelhas','rough-terrain':'Terreno acidentado',gift:'Presente de NPC','gift-egg':'Ovo de presente',static:'Encontro fixo no mapa',pokeflute:'Acordar com Poké Flute','squirt-bottle':'Regar com Squirt Bottle','wailmer-pail':'Regar com Wailmer Pail',seaweed:'Alga submarina (Dive)','roaming-grass':'Errante (grama)','roaming-water':'Errante (água)','devon-scope':'Revelar com Devon Scope','feebas-tile-fishing':'Pescar nos tiles do Feebas','island-scan':'Island Scan',sos:'Chamado SOS','bubbling-spots':'Água borbulhando','berry-trees':'Árvore de berry','npc-trade':'Troca com NPC','sos-from-bubbling-spot':'SOS em água borbulhando',overworld:'Visível no mapa','overworld-water':'Visível na água','overworld-flying':'Voando no mapa','overworld-special':'Visível no mapa (especial)','overworld-flying-special':'Voando (especial)','overworld-water-special':'Na água (especial)',horde:'Horda (5 de uma vez)','hidden-grotto':'Hidden Grotto','honey-tree':'Árvore com Honey','overworld-dirt':'Saindo da terra',wanderer:'Andando no mapa','wanderer-water':'Andando na água','chase-water':'Perseguindo na água','dynamax-adventure':'Dynamax Adventure','max-raid':'Max Raid (toca)','trash-can-ambush':'Lixeira (emboscada)','rustling-bush-ambush':'Arbusto mexendo','ceiling-ambush':'Emboscada do teto','ground-ambush':'Emboscada do chão','sky-ambush':'Emboscada do céu'};
const DICA={headbutt:'Ensine Headbutt (TM/tutor) e bata nas árvores da área. Árvores diferentes têm tabelas diferentes.','headbutt-low':'Árvore "comum": bata em várias árvores da rota.','headbutt-normal':'Ensine Headbutt e bata nas árvores da rota.','headbutt-high':'Árvore "rara": poucas árvores da rota têm essa tabela.','rock-smash':'Use Rock Smash nas pedras quebráveis.','old-rod':'Use a Old Rod virado para a água.','good-rod':'Use a Good Rod virado para a água.','super-rod':'Use a Super Rod virado para a água.','honey-tree':'Passe Honey na árvore, espere 6 a 24 h e volte.',swarm:'Surto: só aparece no dia em que a TV/rádio anuncia o surto.',sos:'Use False Swipe + Adrenaline Orb e deixe o Pokémon chamar ajuda.','pokeflute':'Toque a Poké Flute para acordá-lo; é único, salve antes.',static:'Encontro único: salve o jogo antes.','max-raid':'Toca com luz roxa/vermelha no Wild Area. Mude a data do console para trocar a toca.','grass-spots':'Use o Poké Radar e ande na grama tremendo.','feebas-tile-fishing':'Só alguns tiles da Route 119 têm Feebas; pesque tile a tile.','squirt-bottle':'Regue a árvore que se mexe com a Squirt Bottle.','devon-scope':'Use a Devon Scope no Kecleon invisível.','horde':'Use Sweet Scent na grama para forçar hordas.','hidden-grotto':'Entre no buraco escondido; o Pokémon muda a cada dia.','island-scan':'Gaste 100 Festival Coins no Pokémon Center da ilha; depende do dia da semana.','npc-trade':'Troca com NPC: você precisa entregar o Pokémon pedido.'};
const SKIP=/^(swarm-no|radar-off|radio-off|slot2-none|item-none|other-none|story-progress-none|great-marsh-daily-slot-none)$/;
function cond(c){
  const m={'time-morning':'Manhã','time-day':'Dia','time-night':'Noite','swarm-yes':'Surto ativo','radar-on':'Poké Radar ligado','radio-hoenn':'Rádio: som de Hoenn','radio-sinnoh':'Rádio: som de Sinnoh','season-spring':'Primavera','season-summer':'Verão','season-autumn':'Outono','season-winter':'Inverno','story-progress-hall-of-fame':'Depois do Hall of Fame','story-progress-before-hall-of-fame':'Antes do Hall of Fame','story-progress-national-dex':'Com a Dex Nacional','story-progress-before-national-dex':'Antes da Dex Nacional'};
  if(m[c])return m[c];
  let r;
  if(r=c.match(/^weather-(.+)/))return'Clima: '+({normal:'normal',overcast:'nublado',raining:'chuva',thunderstorm:'tempestade',snowing:'neve',snowstorm:'nevasca',sunny:'sol forte','intense-sun':'sol forte',sandstorm:'tempestade de areia','heavy-fog':'neblina',fog:'neblina'}[r[1]]||r[1]);
  if(r=c.match(/^slot2-(.+)/))return'Cartucho '+pretty(r[1])+' no slot GBA';
  if(r=c.match(/^weekday-(.+)/))return({sunday:'Domingo',monday:'Segunda',tuesday:'Terça',wednesday:'Quarta',thursday:'Quinta',friday:'Sexta',saturday:'Sábado'}[r[1]]);
  if(r=c.match(/^max-den-rating-(\d)/))return r[1]+'★';
  if(r=c.match(/^max-den-rarity-(.+)/))return'Toca '+({common:'comum',rare:'rara',special:'especial'}[r[1]]||r[1]);
  if(r=c.match(/^story-progress-(.+)/))return'Progresso: '+pretty(r[1]);
  return pretty(c);
}

let G='sword',ENTRIES=[],GOT=new Set(),SEL=null;
const key=()=>'ld:'+G+':'+$('#mode').value;
function sprite(id,shiny){const g=GAMES[G],s=shiny?'shiny/':'';
  if(G==='black'&&id<=649)return SPR+'versions/generation-v/black-white/animated/'+s+id+'.gif';
  // Gen 1 não tem shiny: cai no sprite moderno.
  return g.spr&&id<=g.nat&&!(shiny&&G==='yellow')?SPR+'versions/'+g.spr+'/'+s+id+'.png':SPR+s+id+'.png'}
const art=(id,shiny)=>SPR+'other/official-artwork/'+(shiny?'shiny/':'')+id+'.png';
const TCOR={normal:'#9fa19f',fire:'#e62829',water:'#2980ef',electric:'#fac000',grass:'#3fa129',ice:'#3dcef3',fighting:'#ff8000',poison:'#9141cb',ground:'#915121',flying:'#81b9ef',psychic:'#ef4179',bug:'#91a119',rock:'#afa981',ghost:'#704170',dragon:'#5060e1',dark:'#624d4e',steel:'#60a1b8',fairy:'#ef70ef'};
const TPT={normal:'Normal',fire:'Fogo',water:'Água',electric:'Elétrico',grass:'Planta',ice:'Gelo',fighting:'Lutador',poison:'Veneno',ground:'Terra',flying:'Voador',psychic:'Psíquico',bug:'Inseto',rock:'Pedra',ghost:'Fantasma',dragon:'Dragão',dark:'Sombrio',steel:'Aço',fairy:'Fada'};

async function loadDex(){
  const g=GAMES[G];$('#list').innerHTML='<div class="empty">Carregando dex...</div>';
  try{
    if($('#mode').value==='nat'){
      const d=await get('pokemon-species?limit='+g.nat);ENTRIES=d.results.map((s,i)=>({n:i+1,id:i+1,name:s.name}));
    }else{
      const seen=new Set();ENTRIES=[];
      for(const dx of g.dex){const d=await get('pokedex/'+dx);for(const e of d.pokemon_entries){const id=idOf(e.pokemon_species.url);if(seen.has(id))continue;seen.add(id);ENTRIES.push({n:ENTRIES.length+1,id,name:e.pokemon_species.name})}}
    }
  }catch(e){$('#list').innerHTML='<div class="empty">Falha ao carregar a dex ('+esc(e.message)+'). Verifique a internet e recarregue.</div>';return}
  GOT=new Set(ls.get(key(),[]));renderList();
}
function renderList(){
  const q=norm($('#q').value),f=$('#show').value;
  const rows=ENTRIES.filter(e=>(!q||norm(e.name).includes(q)||String(e.id)===q||String(e.n)===q)&&(f==='all'||(f==='got')===GOT.has(e.id)));
  $('#list').innerHTML=rows.map(e=>`<div class="row${GOT.has(e.id)?' got':''}${SEL===e.id?' sel':''}" data-id="${e.id}"><span class="n">#${String(e.n).padStart(3,'0')}</span><img loading="lazy" src="${sprite(e.id)}" alt="" onerror="this.src='${SPR}${e.id}.png'"><span class="nm">${esc(e.name.replace(/-/g,' '))}</span><input type="checkbox" title="Tenho na living dex" ${GOT.has(e.id)?'checked':''}></div>`).join('')||'<div class="empty">Nada encontrado.</div>';
  const t=ENTRIES.length,c=ENTRIES.filter(e=>GOT.has(e.id)).length;
  $('#prog').textContent=`${GAMES[G].nome}: ${c}/${t} (${t?Math.round(c*100/t):0}%)`;$('#pbar').style.width=(t?c*100/t:0)+'%';
}
$('#list').addEventListener('click',ev=>{
  const row=ev.target.closest('.row');if(!row)return;const id=+row.dataset.id;
  if(ev.target.type==='checkbox'){ev.target.checked?GOT.add(id):GOT.delete(id);ls.set(key(),[...GOT]);renderList();return}
  showMon(id);
});

async function encountersFor(species){
  // Formas regionais (Galar/Alola) são "pokemon" separados: junta os encontros de todas as variedades.
  const vers=GAMES[G].ver,out=[];
  for(const v of species.varieties){
    const pid=idOf(v.pokemon.url),form=v.is_default?'':v.pokemon.name.replace(species.name+'-','');
    let enc=[];try{enc=await get('pokemon/'+pid+'/encounters')}catch{}
    for(const a of enc)for(const vd of a.version_details)if(vers.includes(vd.version.name))out.push({area:a.location_area.name,ver:vd.version.name,form,det:vd.encounter_details});
  }
  return out;
}
function groupDetails(det){
  const m=new Map();
  for(const d of det){
    const cs=d.condition_values.map(c=>c.name).filter(c=>!SKIP.test(c));
    const k=d.method.name+'|'+cs.join(',');
    const o=m.get(k)||{method:d.method.name,cs,min:99,max:0,ch:0};
    o.min=Math.min(o.min,d.min_level);o.max=Math.max(o.max,d.max_level);o.ch+=d.chance;m.set(k,o);
  }
  return[...m.values()];
}
function evoHow(d){
  if(!d)return'';const p=[],t=d.trigger?.name;
  if(t==='trade')p.push('troca'+(d.held_item?' segurando '+pretty(d.held_item.name):'')+(d.trade_species?' por '+pretty(d.trade_species.name):''));
  else if(t==='use-item')p.push('usar '+pretty(d.item.name));
  else if(t==='shed')p.push('vaga livre + Poké Ball no Nv.20 do Nincada');
  else if(t&&t!=='level-up')p.push(pretty(t));
  if(d.min_level)p.push('Nv. '+d.min_level);
  if(t==='level-up'&&!d.min_level)p.push('subir de nível');
  if(d.min_happiness)p.push('amizade alta');
  if(d.min_affection)p.push('afeto alto');
  if(d.min_beauty)p.push('beleza alta');
  if(d.time_of_day)p.push(d.time_of_day==='day'?'de dia':d.time_of_day==='night'?'de noite':d.time_of_day);
  if(d.held_item&&t!=='trade')p.push('segurando '+pretty(d.held_item.name));
  if(d.known_move)p.push('sabendo '+pretty(d.known_move.name));
  if(d.known_move_type)p.push('com golpe tipo '+d.known_move_type.name);
  if(d.location)p.push('em '+pretty(d.location.name));
  if(d.gender)p.push(d.gender===1?'fêmea':'macho');
  if(d.needs_overworld_rain)p.push('chovendo');
  if(d.party_species)p.push('com '+pretty(d.party_species.name)+' no time');
  if(d.party_type)p.push('com tipo '+d.party_type.name+' no time');
  if(d.relative_physical_stats!=null)p.push({1:'Atk > Def',0:'Atk = Def','-1':'Atk < Def'}[d.relative_physical_stats]);
  if(d.turn_upside_down)p.push('console de cabeça pra baixo');
  return p.join(', ');
}
function evoHtml(node,first=true){
  const id=idOf(node.species.url);
  const how=node.evolution_details.map(evoHow).filter(Boolean);
  const me=`${first?'':'<span>→</span>'}<span class="st" data-go="${id}"><img loading="lazy" src="${sprite(id)}" onerror="this.src='${SPR}${id}.png'" alt="">${esc(node.species.name.replace(/-/g,' '))}${how.length?`<br><span class="how2">${esc(how.join(' ou '))}</span>`:''}</span>`;
  if(!node.evolves_to.length)return me;
  if(node.evolves_to.length===1)return me+evoHtml(node.evolves_to[0],false);
  return me+'<span>→</span><span class="evo" style="flex-direction:column;align-items:flex-start">'+node.evolves_to.map(n=>'<span class="evo">'+evoHtml(n,true)+'</span>').join('')+'</span>';
}

async function showMon(id){
  SEL=id;renderList();const det=$('#det');det.innerHTML='<div class="empty">Consultando a Pokédex...</div>';
  const g=GAMES[G];
  try{
    const sp=await get('pokemon-species/'+id);
    const [pk,encs,chain]=await Promise.all([get('pokemon/'+id),encountersFor(sp),get(sp.evolution_chain.url)]);
    const flav=(sp.flavor_text_entries.find(f=>f.language.name==='en'&&g.ver.includes(f.version.name))||sp.flavor_text_entries.find(f=>f.language.name==='en'))?.flavor_text.replace(/\s+/g,' ')||'';
    const byArea=new Map();for(const e of encs){const k=e.area+'|'+e.form;(byArea.get(k)||byArea.set(k,[]).get(k)).push(e)}
    let locHtml='';
    for(const [k,list] of byArea){
      const [area,form]=k.split('|');const rows=groupDetails(list.flatMap(e=>e.det));
      const dlc=list.some(e=>e.ver.includes('isle-of-armor'))?' (Isle of Armor)':list.some(e=>e.ver.includes('crown-tundra'))?' (Crown Tundra)':'';
      const tips=[...new Set(rows.map(r=>DICA[r.method]).concat(rows.some(r=>r.cs.includes('swarm-yes'))?[DICA.swarm]:[]).filter(Boolean))];
      locHtml+=`<div class="loc"><h4><span>${esc(pretty(area))}${dlc}${form?' <span class="tag">forma '+esc(form)+'</span>':''}</span><span><a href="#" data-area="${esc(area)}">quem mais tem aqui</a> · <a target="_blank" rel="noopener" href="https://bulbapedia.bulbagarden.net/w/index.php?search=${encodeURIComponent(pretty(area))}">mapa (Bulbapedia)</a></span></h4>`+
        rows.map(r=>`<p class="how"><b>${esc(METODO[r.method]||pretty(r.method))}</b> <em>Nv. ${r.min===r.max?r.min:r.min+'-'+r.max} · ${Math.min(r.ch,100)}%</em> ${r.cs.map(c=>'<span class="tag">'+esc(cond(c))+'</span>').join('')}</p>`).join('')+
        tips.map(t=>'<div class="tip">'+esc(t)+'</div>').join('')+'</div>';
    }
    if(!locHtml)locHtml='<div class="loc">Não aparece selvagem em '+esc(g.nome)+'. Veja a linha evolutiva abaixo (evoluir, chocar ovo ou trazer de outro jogo/troca).</div>';
    const other=await otherGames(sp);
    const gen=(sp.genera.find(x=>x.language.name==='en')||{}).genus||'';
    det.innerHTML=`<div class="lcd"><div class="top"><div><div class="art"><img class="big" id="artimg" src="${art(id)}" alt="${esc(sp.name)}"><img id="sprimg" src="${sprite(id)}" onerror="this.src='${SPR}${id}.png'" alt="sprite de ${esc(g.nome)}" title="Sprite de ${esc(g.nome)}"></div><button class="shiny" id="shinybtn" aria-pressed="false">✨ Ver shiny</button></div><div><h2>#${String(id).padStart(3,'0')} ${esc(sp.name.replace(/-/g,' '))}</h2><div style="font-size:18px">${esc(gen)} · ${pk.height/10} m · ${pk.weight/10} kg</div><div class="types">${pk.types.map(t=>`<span style="background:${TCOR[t.type.name]||'#777'}">${TPT[t.type.name]||t.type.name}</span>`).join('')}</div><div style="font-size:17px;max-width:520px">${esc(flav)}</div><audio id="cry" src="https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${id}.ogg" preload="none"></audio><button class="shiny" onclick="document.getElementById('cry').play()">🔊 Grito</button></div></div></div>
      <div class="body"><label style="font-size:14px"><input type="checkbox" id="gotme" ${GOT.has(id)?'checked':''}> Tenho na living dex de ${esc(g.nome)}</label>
      <h3>Onde encontrar</h3>${locHtml}
      <h3>Linha evolutiva</h3><div class="evo">${evoHtml(chain.chain)}</div>
      <h3>Nos seus outros jogos</h3><div class="ga">${other}</div></div>`;
    $('#shinybtn').onclick=e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',on);e.target.textContent=on?'Ver normal':'✨ Ver shiny';$('#artimg').src=art(id,on);$('#sprimg').src=sprite(id,on)};
    $('#gotme').onchange=e=>{e.target.checked?GOT.add(id):GOT.delete(id);ls.set(key(),[...GOT]);renderList()};
  }catch(e){det.innerHTML='<div class="empty">Erro ao consultar ('+esc(e.message)+').</div>'}
}
async function otherGames(sp){
  const vs=new Set();
  for(const v of sp.varieties){try{for(const a of await get('pokemon/'+idOf(v.pokemon.url)+'/encounters'))for(const d of a.version_details)vs.add(d.version.name)}catch{}}
  const ok=Object.entries(GAMES).filter(([k,g])=>k!==G&&g.ver.some(v=>vs.has(v))).map(([,g])=>g.nome);
  return ok.length?'Selvagem/presente também em: '+ok.join(', '):'Não aparece selvagem nos seus outros jogos.';
}
async function showArea(area){
  const det=$('#det');det.innerHTML='<div class="empty">Carregando local...</div>';const g=GAMES[G];
  try{
    const a=await get('location-area/'+area);
    const mons=a.pokemon_encounters.filter(p=>p.version_details.some(v=>g.ver.includes(v.version.name))).map(p=>({pid:idOf(p.pokemon.url),name:p.pokemon.name}));
    const sid=n=>ENTRIES.find(e=>e.name===n||n.startsWith(e.name+'-'))?.id;
    det.innerHTML=`<div class="lcd"><h2 style="font:400 22px Silkscreen,monospace;margin:0">${esc(pretty(area))}</h2>${esc(g.nome)} · ${mons.length} Pokémon · vermelho = falta na sua dex</div><div class="body"><div class="chips">${mons.map(m=>{const id=sid(m.name);return`<span class="${id&&!GOT.has(id)?'miss':''}" data-go="${id||m.pid}"><img loading="lazy" src="${SPR}${m.pid}.png" alt="">${esc(m.name.replace(/-/g,' '))}</span>`}).join('')||'Sem dados deste jogo.'}</div><p><a target="_blank" rel="noopener" href="https://bulbapedia.bulbagarden.net/w/index.php?search=${encodeURIComponent(pretty(area))}">Ver mapa na Bulbapedia</a></p></div>`;
  }catch(e){det.innerHTML='<div class="empty">Erro ('+esc(e.message)+').</div>'}
}
$('#det').addEventListener('click',ev=>{
  const a=ev.target.closest('[data-area]');if(a){ev.preventDefault();showArea(a.dataset.area);return}
  const go=ev.target.closest('[data-go]');if(go&&+go.dataset.go<10000)showMon(+go.dataset.go);
});

$('#game').innerHTML=Object.entries(GAMES).map(([k,g])=>`<option value="${k}">${g.nome}</option>`).join('');
G=ls.get('ld:last','sword');if(!GAMES[G])G='sword';$('#game').value=G;$('#mode').value=ls.get('ld:mode','reg');
$('#game').onchange=e=>{G=e.target.value;ls.set('ld:last',G);SEL=null;$('#det').innerHTML='<div class="empty">Escolha um Pokémon na lista.</div>';loadDex()};
$('#mode').onchange=e=>{ls.set('ld:mode',e.target.value);loadDex()};
$('#q').oninput=$('#show').onchange=renderList;
$('#exp').onclick=()=>{const d={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('ld:'))d[k]=JSON.parse(localStorage.getItem(k))}}catch{}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='livingdex-progresso.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());for(const k in d)if(k.startsWith('ld:'))ls.set(k,d[k]);loadDex();alert('Progresso importado.')}catch{alert('Arquivo inválido.')}};
loadDex();
</script>
</body>
</html>
